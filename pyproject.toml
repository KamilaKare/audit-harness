[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-harness"
version = "0.1.0"
description = "Evidence-first Purchase-to-Pay control testing harness"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "pandas>=2.2,<3", "pyyaml>=6,<7", "langgraph>=1,<2", "httpx>=0.28,<1", "opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2"]

[project.optional-dependencies]
observability = ["langfuse>=4.18,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
audit-harness = "audit_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_integration.py" = ["E402"]
